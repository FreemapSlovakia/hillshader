[package]
name = "laz2dem"
version = "0.1.0"
edition = "2024"

[dependencies]
gdal = { version = "0.19.0", features = ["bindgen"] }
image = { version = "0.25.9", default-features = false, features = [
    "jpeg",
    "png",
] }
las = { version = "0.9.10", features = ["laz-parallel"] }
proj = "0.27.0"
rayon = "1.11.0"
rusqlite = "0.38.0"
spade = "2.15.0"
tilemath = "0.3.0"
zstd = "0.13.3"
clap = { version = "4.5.39", features = ["derive"] }
itertools = "0.14.0"
ndarray = "0.17.2"
lerc = "0.2.1"
lru = "0.16.3"

[profile.release]
panic = "abort"
